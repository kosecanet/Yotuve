name: Compilar APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar proyecto
        run: |
          Z=$(find . -name "*.zip" | head -1)
          echo "Zip: $Z"
          if [ -n "$Z" ]; then unzip -q -o "$Z" -d src; fi
          F=$(find . -name settings.gradle.kts | head -1)
          echo "Proyecto en: $F"
          echo "PROJ=$(dirname "$F")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: gradle assembleRelease --no-daemon
        working-directory: ${{ env.PROJ }}
      - uses: actions/upload-artifact@v4
        with:
          name: yotuve-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
