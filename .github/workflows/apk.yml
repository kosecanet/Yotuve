name: Compilar APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar proyecto
        run: |
          Z=$(find . -name "*.zip" | head -1)
          if [ -n "$Z" ]; then unzip -q -o "$Z" -d src; fi
          F=$(find . -name settings.gradle.kts | head -1)
          echo "PROJ=$(dirname "$F")" >> $GITHUB_ENV
      - name: Compilar QuickJS para Android
        continue-on-error: true
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          git clone --depth 1 https://github.com/quickjs-ng/quickjs qjs-src
          cmake -S qjs-src -B qjs-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26
          cmake --build qjs-build --target qjs -j4
          mkdir -p "$PROJ/app/src/main/jniLibs/arm64-v8a"
          cp qjs-build/qjs "$PROJ/app/src/main/jniLibs/arm64-v8a/libqjs.so"
          echo "::notice::QuickJS compilado"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Compilar
        working-directory: ${{ env.PROJ }}
        run: |
          set +e
          gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }} 2>&1 | tee build.log
          R=${PIPESTATUS[0]}
          grep -E "^e: |What went wrong|Could not" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          exit $R
      - name: Publicar versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$PROJ/app/build/outputs/apk/release"
          for f in *.apk; do mv "$f" "${f/app-/yotuve-}"; done
          gh release create "v${{ github.run_number }}" *.apk --repo "${{ github.repository }}" --title "yotuve ${{ github.run_number }}" --notes "Compilación automática"
