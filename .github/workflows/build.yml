name: Compilar APK y publicar Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ya trae el SDK y el NDK de Android

      # Intérprete JavaScript para yt-dlp (vídeos "para niños" o con restricciones).
      # Si falla, el APK se compila igual, solo que sin QuickJS.
      - name: Compilar QuickJS para Android
        continue-on-error: true
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          git clone --depth 1 https://github.com/quickjs-ng/quickjs "$RUNNER_TEMP/qjs-src"
          cmake -S "$RUNNER_TEMP/qjs-src" -B "$RUNNER_TEMP/qjs-build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26
          cmake --build "$RUNNER_TEMP/qjs-build" --target qjs_exe -j4 || cmake --build "$RUNNER_TEMP/qjs-build" -j4
          QJS=$(find "$RUNNER_TEMP/qjs-build" -maxdepth 2 -type f -name qjs | head -1)
          test -n "$QJS"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$QJS" app/src/main/jniLibs/arm64-v8a/libqjs.so
          echo "::notice::QuickJS compilado e incluido"

      - name: Compilar APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }} 2>&1 | tee build.log
          R=${PIPESTATUS[0]}
          grep -E "^e: |What went wrong|Could not" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          exit $R

      - name: Renombrar APK
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" .apk); n=${n#app-}; n=${n%-release}
            cp "$f" "out/yotuve-$n-1.${{ github.run_number }}.apk"
          done
          ls out

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: yotuve 1.${{ github.run_number }}
          body: |
            APK para Android (sin anuncios). Instala `yotuve-arm64-v8a-…apk` (casi todos los móviles)
            o `yotuve-universal-…apk` si ese no funciona.
            Commit: ${{ github.sha }}
          files: out/*.apk
          make_latest: true
