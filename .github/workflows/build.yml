name: Compilar APK y publicar Release

# Cada push a main (o "Run workflow" a mano) compila y publica la Release.
# Las notas de la versión son la primera sección de CHANGELOG.md.
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar la Release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Número de versión: compilación + 200 (por encima de las versiones del flujo anterior)
      - name: Número de versión
        run: echo "VC=$(( ${{ github.run_number }} + 200 ))" >> "$GITHUB_ENV"

      # ubuntu-latest ya trae el SDK y el NDK de Android

      # Intérprete JavaScript para yt-dlp (vídeos "para niños" o con restricciones).
      # Si falla, el APK se compila igual, solo que sin QuickJS.
      - name: Compilar QuickJS para Android
        continue-on-error: true
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          git clone --depth 1 https://github.com/quickjs-ng/quickjs "$RUNNER_TEMP/qjs-src"
          cmake -S "$RUNNER_TEMP/qjs-src" -B "$RUNNER_TEMP/qjs-build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26
          cmake --build "$RUNNER_TEMP/qjs-build" --target qjs_exe -j4 || cmake --build "$RUNNER_TEMP/qjs-build" -j4
          QJS=$(find "$RUNNER_TEMP/qjs-build" -maxdepth 2 -type f -name qjs | head -1)
          test -n "$QJS"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$QJS" app/src/main/jniLibs/arm64-v8a/libqjs.so
          echo "::notice::QuickJS compilado e incluido"

      - name: Compilar APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon -PversionCode=$VC 2>&1 | tee build.log
          R=${PIPESTATUS[0]}
          grep -E "^e: |What went wrong|Could not" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          exit $R

      - name: Renombrar APK
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" .apk); n=${n#app-}; n=${n%-release}
            cp "$f" "out/yotuve-$n-1.$VC.apk"
          done
          ls out

      - uses: actions/upload-artifact@v4
        with:
          name: yotuve-1.${{ env.VC }}
          path: out/*arm64*.apk
          retention-days: 1

      - name: Notas de la versión (primera sección de CHANGELOG.md)
        if: github.event_name == 'push' || inputs.publicar
        run: |
          awk '/^## /{n++; if(n==1){next}} n==1' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "Instala \`yotuve-arm64-v8a-…apk\` (casi todos los móviles) o \`yotuve-universal-…apk\` si ese no funciona." >> notes.md
          cat notes.md

      - name: Publicar Release
        if: github.event_name == 'push' || inputs.publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VC }}
          name: yotuve 1.${{ env.VC }}
          body_path: notes.md
          files: out/*.apk
          make_latest: true
